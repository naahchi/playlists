<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Music Player</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <main class="player">


        <!-- =========================
             HEADER
        ========================== -->

        <header class="topbar">

            <div>

                <h1>My Music</h1>

                <p>My Personal Music Library</p>

            </div>

        </header>



        <!-- =========================
             NOW PLAYING
        ========================== -->

        <section class="now-playing">


            <div
                class="album-art"
                id="albumArt"
            >

                ♪

            </div>



            <div class="song-info">

                <h2 id="songTitle">
                    Loading music...
                </h2>

                <p id="songArtist">
                    Please wait
                </p>

            </div>


        </section>



        <!-- =========================
             PROGRESS
        ========================== -->

        <section class="progress-section">


            <span id="currentTime">
                0:00
            </span>


            <input
                type="range"
                id="progressBar"
                min="0"
                max="100"
                value="0"
            >


            <span id="duration">
                0:00
            </span>


        </section>



        <!-- =========================
             PLAYER CONTROLS
        ========================== -->

        <section class="controls">


            <button
                id="shuffleBtn"
                class="secondary-control"
                title="Shuffle"
            >

                ⤨

            </button>



            <button
                id="previousBtn"
                class="control-btn"
                title="Previous"
            >

                ⏮️

            </button>



            <button
                id="playBtn"
                class="play-btn"
                title="Play"
            >

                ▶️

            </button>



            <button
                id="nextBtn"
                class="control-btn"
                title="Next"
            >

                ⏭️

            </button>



            <button
                id="repeatBtn"
                class="secondary-control"
                title="Repeat"
            >

                ↻

            </button>


        </section>



        <!-- =========================
             VOLUME
        ========================== -->

        <section class="volume-section">


            <span
                id="volumeIcon"
                class="volume-icon"
                title="Mute / Unmute"
            >

                🔊

            </span>


            <input
                type="range"
                id="volumeBar"
                min="0"
                max="1"
                step="0.01"
                value="0.3"
            >


        </section>



        <!-- =========================
             PLAYLIST SECTION
        ========================== -->

        <section class="playlist-section">


            <!-- Playlist Tabs -->

            <div class="playlist-tabs">
                <button class="playlist-tab active" data-playlist="all">All</button>
                <button class="playlist-tab active" data-playlist="romantic">Romantic</button>
                <button class="playlist-tab active" data-playlist="energetic">Energetic</button>
                <button class="playlist-tab active" data-playlist="sad">Sad</button>
                <button class="playlist-tab active" data-playlist="sad">Sad</button>
                <button class="playlist-tab active" data-playlist="sad">Sad</button>
                <button class="playlist-tab active" data-playlist="sad">Sad</button>
                <button class="playlist-tab active" data-playlist="sad">Sad</button>
            </div>



            <!-- Playlist Header -->

            <div class="playlist-header">


                <h3>
                    Playlist
                </h3>


                <span id="songCount">
                    0 songs
                </span>


            </div>



            <!-- Songs -->

            <div
                id="playlist"
                class="playlist"
            >

                <div class="loading">

                    Loading playlist...

                </div>

            </div>


        </section>



        <!-- =========================
             AUDIO PLAYER
        ========================== -->

        <audio
            id="audioPlayer"
        ></audio>


    </main>



    <!-- JavaScript -->

    <script src="script.js"></script>


</body>

</html>
